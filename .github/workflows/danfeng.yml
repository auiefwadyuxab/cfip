name: Danfeng CSV 自动汇总

on:
  push:
    paths:
      - 'danfeng/*.csv'
      - 'danfeng/**/*.csv'
      - 'danfeng/*.[cC][sS][vV]'
      - 'danfeng/**/*.[cC][sS][vV]'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: danfeng-csv-aggregation-${{ github.event.repository.default_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  aggregate:
    name: 提取并汇总 IP:端口
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: 提取、去重并生成日志
        id: aggregate
        run: python danfeng/danfeng.py

      - name: 检查输出文件
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          test -f danfeng/danfeng.txt
          test -f danfeng/danfeng.log
          if grep -nE '[[:space:]]|^$' danfeng/danfeng.txt; then
            echo 'danfeng.txt 存在空行或空白字符。' >&2
            exit 1
          fi
          echo "✓ danfeng.txt：$(wc -l < danfeng/danfeng.txt) 条唯一 IP:端口"
          echo '✓ danfeng.log：日志已生成'

      - name: 提交本次日志与成功的汇总结果
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        env:
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- danfeng/danfeng.log
          if [[ "$AGGREGATE_OUTCOME" == "success" && "$VALIDATE_OUTCOME" == "success" ]]; then
            git add -- danfeng/danfeng.txt
          else
            echo '本次汇总或校验未成功：只提交最新诊断日志，不提交 danfeng.txt。' >&2
          fi
          if git diff --cached --quiet; then
            echo '日志和结果没有变化。'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'chore: 更新 Danfeng IP 汇总与日志'
          for attempt in 1 2 3; do
            if ! git fetch origin "$GITHUB_REF_NAME"; then
              echo "获取远端分支失败，第 ${attempt}/3 次。" >&2
            elif ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo '同步远端提交时发生冲突，停止推送。' >&2
              exit 1
            elif git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            else
              echo "推送失败，第 ${attempt}/3 次。" >&2
            fi
            sleep "$((attempt * 2))"
          done
          echo '推送在 3 次尝试后仍失败。' >&2
          exit 1
