name: 订阅聚合

on:
  schedule:
    - cron: '17 */3 * * *'
      timezone: 'Asia/Taipei'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 订阅聚合
  cancel-in-progress: false

jobs:
  aggregate:
    name: 订阅聚合
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 配置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: 安装运行依赖
        run: python -m pip install --disable-pip-version-check --no-input 'requests==2.34.2'

      - name: 运行订阅聚合
        env:
          SUB: ${{ secrets.sub }}
          PYTHONUNBUFFERED: '1'
        run: python sub/sub.py

      - name: 严格校验输出
        shell: bash
        run: |
          set -euo pipefail
          test -s sub/sub.txt
          test "$(wc -l < sub/sub.txt)" -eq "$(grep -c '^' sub/sub.txt)"
          test "$(grep -Ec '^((\[[0-9A-Fa-f:.]+\])|([A-Za-z0-9.-]+)):[1-9][0-9]{0,4}$' sub/sub.txt)" -eq "$(wc -l < sub/sub.txt)"
          test "$(grep -cFx '127.0.0.1:1234' sub/sub.txt || true)" -eq 0
          test "$(sort sub/sub.txt | uniq -d | wc -l)" -eq 0
          if grep -nE '[[:space:]]|^$' sub/sub.txt; then
            echo 'sub/sub.txt 存在空行或空白字符。' >&2
            exit 1
          fi
          test "$(grep -Eio 'https?://|token[=:]' sub/sub_stats.txt | wc -l)" -eq 0
          test -s sub/sub_stats.txt
          echo "✓ 最终输出：$(wc -l < sub/sub.txt) 个唯一 HOST:PORT"

      - name: 提交最新结果
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sub/sub.txt sub/sub_stats.txt
          if git diff --cached --quiet; then
            echo '✓ 节点与统计均无变化。'
            exit 0
          fi
          git commit -m 'chore: 更新订阅聚合结果'
          git push
