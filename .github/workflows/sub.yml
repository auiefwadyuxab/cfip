name: 订阅聚合

on:
  workflow_run:
    workflows:
      - 'bestcf'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sub-aggregate-${{ github.event.repository.default_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  aggregate:
    name: 订阅聚合
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      TARGET_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref_name }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: sub/requirements.txt

      - name: 安装依赖
        run: python -m pip install --disable-pip-version-check --no-input --requirement sub/requirements.txt

      - name: 检查 Python 依赖
        run: python -m pip check

      - name: 运行四面板订阅聚合
        env:
          SUB: ${{ secrets.sub }}
        run: python sub/sub.py

      - name: 检查最终输出
        shell: bash
        run: |
          set -euo pipefail
          test -s sub/sub.txt
          test -s sub/sub_stats.txt
          test "$(grep -Ec '^((\[[0-9A-Fa-f:.]+\])|([A-Za-z0-9.-]+)):[1-9][0-9]{0,4}$' sub/sub.txt)" -eq "$(wc -l < sub/sub.txt)"
          test "$(grep -cFx '127.0.0.1:1234' sub/sub.txt || true)" -eq 0
          test "$(sort sub/sub.txt | uniq -d | wc -l)" -eq 0
          if grep -nE '[[:space:]]|^$' sub/sub.txt; then
            echo 'sub/sub.txt 存在空行或空白字符。' >&2
            exit 1
          fi
          if grep -Eiq 'https?://|token[=:]' sub/sub_stats.txt; then
            echo 'sub_stats.txt 疑似包含 URL 或 token。' >&2
            exit 1
          fi
          echo "✓ 最终输出：$(wc -l < sub/sub.txt) 个唯一 HOST:PORT"

      - name: 提交最新结果
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sub/sub.txt sub/sub_stats.txt
          if git diff --cached --quiet; then
            echo '节点和统计均无变化。'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'chore: 更新订阅聚合结果'

          for attempt in 1 2 3; do
            if ! git fetch origin "$TARGET_BRANCH"; then
              echo "获取远端分支失败，第 ${attempt}/3 次。" >&2
            elif ! git rebase "origin/$TARGET_BRANCH"; then
              git rebase --abort || true
              echo '同步远端提交时发生冲突，停止推送。' >&2
              exit 1
            elif git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            else
              echo "推送失败，第 ${attempt}/3 次。" >&2
            fi
            sleep "$((attempt * 2))"
          done
          echo '推送在 3 次尝试后仍失败。' >&2
          exit 1
