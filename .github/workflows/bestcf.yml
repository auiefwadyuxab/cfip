name: bestcf

on:
  schedule:
    # 每天北京时间 08:17 运行（UTC 00:17）。
    - cron: "17 0 * * *"
  workflow_dispatch:

concurrency:
  group: bestcf-daily-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run bestcf collector
        run: python bestcf/bestcf.py

      - name: Commit and push only when bestcf.txt changed
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bestcf/bestcf.txt

          if git diff --cached --quiet -- bestcf/bestcf.txt; then
            echo "bestcf.txt 没有变化，不创建提交。"
            exit 0
          fi

          git commit -m "chore(bestcf): update collected links"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
