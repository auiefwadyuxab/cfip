name: bestcf

on:
  # 定时运行由 Cloudflare Worker 负责；这里保留手动运行入口。
  workflow_dispatch:

concurrency:
  group: bestcf-daily-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADMIN: ${{ secrets.ADMIN }}
      url: ${{ secrets.url }}
      TARGET_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}

    steps:
      - name: 检出仓库
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 抓取链接并同步四个面板
        id: bestcf
        run: python bestcf/bestcf.py

      - name: 提交输出和最新运行日志
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        env:
          BESTCF_OUTCOME: ${{ steps.bestcf.outcome }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 成功时提交输出和日志；失败时只提交诊断日志，绝不提交未完成的新输出。
          git add -- bestcf/bestcf.log
          if [[ "$BESTCF_OUTCOME" == "success" ]]; then
            git add -- bestcf/bestcf.txt
          else
            echo 'bestcf 执行失败：只提交本次诊断日志，不提交 bestcf.txt。' >&2
          fi
          if git diff --cached --quiet; then
            echo '输出和日志没有变化，无需提交。'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'chore(bestcf): update links and count report'

          for attempt in 1 2 3; do
            if ! git fetch origin "$TARGET_BRANCH"; then
              echo "获取远端分支失败，第 ${attempt}/3 次。" >&2
            elif ! git rebase "origin/$TARGET_BRANCH"; then
              git rebase --abort || true
              echo '同步远端时发生文件冲突，停止推送。' >&2
              exit 1
            elif git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            else
              echo "推送失败，第 ${attempt}/3 次。" >&2
            fi
            sleep "$((attempt * 2))"
          done
          echo '推送在 3 次尝试后仍失败。' >&2
          exit 1
