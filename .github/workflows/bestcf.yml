name: bestcf

on:
  schedule:
    # UTC 14:17 = 北京时间 22:17。
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只预览，不修改面板或仓库文件"
        required: true
        type: boolean
        default: true

concurrency:
  group: bestcf-daily-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADMIN: ${{ secrets.ADMIN }}
      url: ${{ secrets.url }}
      BESTCF_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Collect links and synchronize panels
        run: python bestcf/bestcf.py

      # Preview mode and failed runs must not commit generated files.
      - name: Commit changed output and count-only report
        if: always() && steps.checkout.outcome == 'success' && env.BESTCF_DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f bestcf/bestcf.txt ]]; then
            git add -- bestcf/bestcf.txt
          fi
          if [[ -f bestcf/bestcf.log ]]; then
            git add -- bestcf/bestcf.log
          fi
          if git diff --cached --quiet; then
            echo "输出和日志没有变化，不创建提交。"
            exit 0
          fi
          git commit -m "chore(bestcf): update links and count report"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
