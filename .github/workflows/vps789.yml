name: vps789

on:
  workflow_dispatch:
  schedule:
    # 每 3 小时运行一次（GitHub Actions 使用 UTC）
    - cron: "0 */3 * * *"

permissions:
  contents: write

concurrency:
  group: vps789-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: vps789/requirements.txt

      - name: 安装 Python 依赖
        working-directory: vps789
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 安装 Chromium
        run: python -m playwright install --with-deps chromium

      - name: 抓取并生成六个端口文件
        working-directory: vps789
        run: |
          set -euo pipefail
          python vps789.py --count 200 --min-count 100

      - name: 严格检查生成结果
        working-directory: vps789
        run: |
          set -euo pipefail

          files=(443.txt 8443.txt 2053.txt 2083.txt 2087.txt 2096.txt)

          for file in "${files[@]}"; do
            test -s "$file"
            count=$(grep -cve '^[[:space:]]*$' "$file")
            echo "$file -> $count lines"
            test "$count" -ge 100
          done

          # 六个端口文件应该使用同一批域名，只改变端口号。
          cut -d: -f1 443.txt > /tmp/vps789_hosts_443.txt
          for file in 8443.txt 2053.txt 2083.txt 2087.txt 2096.txt; do
            cut -d: -f1 "$file" > "/tmp/vps789_hosts_${file%.txt}.txt"
            cmp -s /tmp/vps789_hosts_443.txt "/tmp/vps789_hosts_${file%.txt}.txt"
          done

      - name: 提交并推送
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vps789/443.txt \
                  vps789/8443.txt \
                  vps789/2053.txt \
                  vps789/2083.txt \
                  vps789/2087.txt \
                  vps789/2096.txt

          if git diff --cached --quiet; then
            echo "六个输出文件没有变化，跳过提交。"
            exit 0
          fi

          now="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S %Z')"
          git commit -m "vps789: update ${now}"

          # 在提交后同步默认分支，避免调度期间出现并发提交导致 push 拒绝。
          git fetch origin "${TARGET_BRANCH}"
          git rebase "origin/${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
