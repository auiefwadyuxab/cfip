name: vps789

on:
  workflow_dispatch:
  schedule:
    # 每 3 小时运行一次（GitHub Actions 使用 UTC）
    - cron: "0 */3 * * *"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: vps789/requirements.txt

      - name: 恢复 Playwright 浏览器缓存
        id: playwright-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright/chromium_headless_shell-*
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-headless-shell-v1-${{ hashFiles('vps789/requirements.txt') }}

      - name: 安装 Python 依赖
        working-directory: vps789
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements.txt --disable-pip-version-check

      - name: 安装 Chromium（缓存未命中）
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python -m playwright install --with-deps --only-shell chromium

      - name: 校验 Chromium 环境
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto("about:blank")
              print("Chromium headless launch: PASS")
              browser.close()
          PY

      - name: 保存 Playwright 浏览器缓存
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright/chromium_headless_shell-*
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: 抓取并生成六个端口文件
        id: scrape
        working-directory: vps789
        run: |
          set -euo pipefail
          python vps789.py

      - name: 上传失败诊断
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vps789-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: vps789/.diagnostics/
          if-no-files-found: ignore
          retention-days: 3

      - name: 严格检查生成结果
        working-directory: vps789
        run: |
          set -euo pipefail

          files=(443.txt 8443.txt 2053.txt 2083.txt 2087.txt 2096.txt)
          expected_ports=(443 8443 2053 2083 2087 2096)
          counts=()

          for i in "${!files[@]}"; do
            file="${files[$i]}"
            port="${expected_ports[$i]}"

            test -s "$file"
            count=$(grep -cve '^[[:space:]]*$' "$file")
            echo "$file -> $count lines"
            test "$count" -ge 1
            counts+=("$count")

            awk -v port="$port" '
              /^[[:space:]]*$/ { next }
              {
                prefix = "^[^:#[:space:]]+:" port "#"
                if ($0 !~ prefix) {
                  print "非法输出行（端口或结构错误）: " $0
                  exit 1
                }

                info = $0
                sub(/^.*#/, "", info)

                # 网页源：必须存在延迟ms、丢包率和下载速度。
                # API 补充：允许下载速度为空，但仍必须有延迟ms和丢包率。
                if (info !~ /^[0-9]+(\.[0-9]+)?ms\/[0-9]+(\.[0-9]+)?-[0-9]+(\.[0-9]+)?(KB|MB|GB|TB)\/s$/ &&
                    info !~ /^[0-9]+(\.[0-9]+)?ms\/[0-9]+(\.[0-9]+)?-$/) {
                  print "非法 info: " $0
                  exit 1
                }
              }
            ' "$file"
          done

          for i in 1 2 3 4 5; do
            test "${counts[0]}" -eq "${counts[$i]}"
          done

          awk -F'#' '{sub(/:[0-9]+$/, "", $1); print $1}' 443.txt > /tmp/vps789_hosts_443.txt
          for file in 8443.txt 2053.txt 2083.txt 2087.txt 2096.txt; do
            awk -F'#' '{sub(/:[0-9]+$/, "", $1); print $1}' "$file" > "/tmp/vps789_hosts_${file%.txt}.txt"
            cmp -s /tmp/vps789_hosts_443.txt "/tmp/vps789_hosts_${file%.txt}.txt"
          done

      - name: 检查工作区是否只产生预期输出变化
        run: |
          set -euo pipefail
          git status --short
          unexpected=$(git status --short --untracked-files=all | grep -vE '^.. vps789/(443|8443|2053|2083|2087|2096)\.txt$' || true)
          if [[ -n "$unexpected" ]]; then
            echo "发现非预期文件变化："
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: 提交并推送
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vps789/443.txt \
                  vps789/8443.txt \
                  vps789/2053.txt \
                  vps789/2083.txt \
                  vps789/2087.txt \
                  vps789/2096.txt

          if git diff --cached --quiet; then
            echo "六个输出文件没有变化，跳过提交。"
            exit 0
          fi

          git diff --cached --check
          now="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S %Z')"
          git commit -m "vps789: update ${now}"

          # 抓取阶段完成后工作树已干净；同步并处理短暂的远端提交竞争。
          for attempt in 1 2 3; do
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
          done

          echo "推送在 3 次尝试后仍失败。" >&2
          exit 1
