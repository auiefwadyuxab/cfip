name: vps789

on:
  workflow_dispatch:
  schedule:
    # 每 3 小时运行一次（GitHub Actions 使用 UTC）
    - cron: "0 */3 * * *"

permissions:
  contents: write

concurrency:
  group: vps789-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: vps789/requirements.txt

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.62.0
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 安装 Python 依赖
        working-directory: vps789
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 安装 Chromium
        run: python -m playwright install --with-deps chromium

      - name: 抓取并生成六个端口文件
        working-directory: vps789
        run: |
          set -euo pipefail
          python vps789.py

      - name: 严格检查生成结果
        working-directory: vps789
        run: |
          set -euo pipefail

          files=(443.txt 8443.txt 2053.txt 2083.txt 2087.txt 2096.txt)
          expected_ports=(443 8443 2053 2083 2087 2096)
          counts=()

          for i in "${!files[@]}"; do
            file="${files[$i]}"
            port="${expected_ports[$i]}"

            test -s "$file"
            count=$(grep -cve '^[[:space:]]*$' "$file")
            echo "$file -> $count lines"
            test "$count" -ge 1
            counts+=("$count")

            awk -v port="$port" '
              /^[[:space:]]*$/ { next }
              {
                prefix = "^([^:#[:space:]]+):" port "#"
                if ($0 !~ prefix) {
                  print "非法输出行（端口或结构错误）: " $0
                  exit 1
                }
                info = $0
                sub(/^.*#/, "", info)
                # 网页源必须包含 ms；API 补充项允许没有下载速度，但仍必须有延迟/丢包率。
                if (info !~ /^[0-9]+(?:\.[0-9]+)?ms\/[0-9]+(?:\.[0-9]+)?-[0-9]+(?:\.[0-9]+)?(KB|MB|GB|TB)\/s$/ &&
                    info !~ /^[0-9]+(?:\.[0-9]+)?ms\/[0-9]+(?:\.[0-9]+)?-$/) {
                  print "非法 info: " $0
                  exit 1
                }
              }
            ' "$file"
          done

          for i in 1 2 3 4 5; do
            test "${counts[0]}" -eq "${counts[$i]}"
          done

          awk -F'#' '{sub(/:[0-9]+$/, "", $1); print $1}' 443.txt > /tmp/vps789_hosts_443.txt
          for file in 8443.txt 2053.txt 2083.txt 2087.txt 2096.txt; do
            awk -F'#' '{sub(/:[0-9]+$/, "", $1); print $1}' "$file" > "/tmp/vps789_hosts_${file%.txt}.txt"
            cmp -s /tmp/vps789_hosts_443.txt "/tmp/vps789_hosts_${file%.txt}.txt"
          done

      - name: 提交并推送
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        working-directory: .
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vps789/443.txt \
                  vps789/8443.txt \
                  vps789/2053.txt \
                  vps789/2083.txt \
                  vps789/2087.txt \
                  vps789/2096.txt

          if git diff --cached --quiet; then
            echo "六个输出文件没有变化，跳过提交。"
            exit 0
          fi

          now="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S %Z')"
          git diff --cached --check
          git commit -m "vps789: update ${now}"

          # 提交后工作树已干净，可以安全地同步远端并处理极短的并发窗口。
          for attempt in 1 2 3; do
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
          done

          echo "推送在 3 次尝试后仍失败。" >&2
          exit 1
