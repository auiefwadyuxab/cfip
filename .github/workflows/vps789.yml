name: vps789

on:
  workflow_run:
    workflows:
      - 'bestcf'
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: vps789-${{ github.event.repository.default_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      TARGET_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref_name }}

    steps:
      - name: 检出仓库
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      - name: 初始化本次运行日志和诊断目录
        shell: bash
        run: |
          set -euo pipefail
          VPS789_DIAGNOSTICS_DIR="$RUNNER_TEMP/vps789-diagnostics"
          VPS789_ARTIFACT_DIR="$RUNNER_TEMP/vps789-artifact"
          {
            echo "VPS789_DIAGNOSTICS_DIR=$VPS789_DIAGNOSTICS_DIR"
            echo "VPS789_ARTIFACT_DIR=$VPS789_ARTIFACT_DIR"
          } >> "$GITHUB_ENV"
          rm -f vps789/vps789.log
          rm -rf "$VPS789_DIAGNOSTICS_DIR" "$VPS789_ARTIFACT_DIR"
          mkdir -p "$VPS789_DIAGNOSTICS_DIR" "$VPS789_ARTIFACT_DIR"
          {
            echo 'VPS789 本次运行日志'
            echo "开始时间：$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S %Z')"
            echo '状态：工作流已启动，等待抓取。'
          } > vps789/vps789.log

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: vps789/requirements.txt

      - name: 恢复 Chromium 浏览器缓存
        id: playwright-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright/chromium_headless_shell-*
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-headless-shell-v1-${{ hashFiles('vps789/requirements.txt') }}

      - name: 安装 Python 依赖
        working-directory: vps789
        run: python -m pip install --requirement requirements.txt --disable-pip-version-check

      - name: 准备并校验 Chromium
        shell: bash
        run: |
          set -euo pipefail
          smoke_test() {
            python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto("about:blank")
              print("Chromium headless launch: PASS")
              browser.close()
          PY
          }
          if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]]; then
            echo "Chromium 浏览器缓存命中，执行启动检查。"
            if smoke_test; then
              exit 0
            fi
            echo "缓存无法启动，重新安装 Chromium。" >&2
            python -m playwright install --force --with-deps --only-shell chromium
          else
            echo "未命中 Chromium 浏览器缓存，执行安装。"
            python -m playwright install --with-deps --only-shell chromium
          fi
          smoke_test

      - name: 抓取并生成六端口文件、all.txt 和最新日志
        id: scrape
        working-directory: vps789
        run: python vps789.py

      - name: 校验六端口文件、域名去重及 all.txt
        id: validate
        working-directory: vps789
        shell: bash
        run: |
          set -euo pipefail
          files=(443.txt 8443.txt 2053.txt 2083.txt 2087.txt 2096.txt)
          expected_ports=(443 8443 2053 2083 2087 2096)

          for i in "${!files[@]}"; do
            file="${files[$i]}"
            port="${expected_ports[$i]}"
            test -s "$file"
            awk -v port="$port" '
              /^[[:space:]]*$/ { print "发现空行"; exit 1 }
              /[[:space:]]/ { print "发现空白字符: " $0; exit 1 }
              {
                n = split($0, parts, "#")
                if (n < 2) { print "缺少 # 分隔: " $0; exit 1 }
                split(parts[1], hp, ":")
                if (length(hp) != 2 || hp[2] != port || hp[1] == "") {
                  print "域名或端口结构错误: " $0; exit 1
                }
                host = tolower(hp[1])
                sub(/\.$/, "", host)
                if (seen[host]++) { print "同一端口文件中域名重复: " hp[1]; exit 1 }
              }
            ' "$file"
            echo "✓ $file：$(wc -l < "$file") 个唯一域名"
          done

          # 每个端口文件必须包含相同域名且顺序一致。
          awk -F '[:#]' '{ h=tolower($1); sub(/\.$/, "", h); print h }' 443.txt > /tmp/vps789-hosts-443.txt
          for file in 8443.txt 2053.txt 2083.txt 2087.txt 2096.txt; do
            awk -F '[:#]' '{ h=tolower($1); sub(/\.$/, "", h); print h }' "$file" > "/tmp/vps789-hosts-${file%.txt}.txt"
            cmp -s /tmp/vps789-hosts-443.txt "/tmp/vps789-hosts-${file%.txt}.txt"
          done

          cat "${files[@]}" > /tmp/vps789-all-expected.txt
          cmp -s /tmp/vps789-all-expected.txt all.txt
          test "$(wc -l < all.txt)" -eq "$(( $(wc -l < 443.txt) * 6 ))"
          test -s vps789.log
          grep -Fq 'VPS789 · 域名抓取运行报告' vps789.log
          grep -Fq '✓ 抓取完成' vps789.log
          grep -Fq '运行状态：成功' vps789.log
          echo "✓ all.txt：$(wc -l < all.txt) 条，等于六端口文件直接拼接"
          echo '✓ vps789.log：已确认本次抓取报告、完成标记及最终成功状态'

      - name: 保存 Chromium 浏览器缓存
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright/chromium_headless_shell-*
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-headless-shell-v1-${{ hashFiles('vps789/requirements.txt') }}

      - name: 整理本次运行 Artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VPS789_ARTIFACT_DIR"
          if [[ -f vps789/vps789.log ]]; then
            cp -f vps789/vps789.log "$VPS789_ARTIFACT_DIR/vps789.log"
          fi
          if [[ -d "$VPS789_DIAGNOSTICS_DIR" ]]; then
            find "$VPS789_DIAGNOSTICS_DIR" -maxdepth 1 -type f -exec cp -f {} "$VPS789_ARTIFACT_DIR/" \;
          fi
          echo '本次运行 Artifact 文件：'
          find "$VPS789_ARTIFACT_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: 上传本次运行日志和网页诊断资料
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vps789-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vps789-artifact/
          if-no-files-found: warn

      - name: 确认工作区只有预期输出变化
        run: |
          set -euo pipefail
          git status --short
          unexpected=$(git status --short --untracked-files=all | grep -vE '^.. vps789/(443|8443|2053|2083|2087|2096|all)\.txt$|^.. vps789/vps789\.log$' || true)
          if [[ -n "$unexpected" ]]; then
            echo '发现非预期文件变化：' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: 提交本次日志与成功的抓取结果
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        env:
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -f vps789/vps789.log ]]; then
            git add -- vps789/vps789.log
          fi
          if [[ "$SCRAPE_OUTCOME" == "success" && "$VALIDATE_OUTCOME" == "success" ]]; then
            git add -- vps789/443.txt vps789/8443.txt vps789/2053.txt \
              vps789/2083.txt vps789/2087.txt vps789/2096.txt \
              vps789/all.txt
          else
            echo '本次抓取或校验未成功：只提交本次日志，不提交端口结果。' >&2
          fi
          if git diff --cached --quiet; then
            echo '日志和抓取结果没有变化。'
            exit 0
          fi
          git diff --cached --check
          git commit -m "vps789: update results and latest log"
          for attempt in 1 2 3; do
            if ! git fetch origin "$TARGET_BRANCH"; then
              echo "获取远端分支失败，第 ${attempt}/3 次。" >&2
            elif ! git rebase "origin/$TARGET_BRANCH"; then
              git rebase --abort || true
              echo '同步远端提交时发生冲突，停止推送。' >&2
              exit 1
            elif git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            else
              echo "推送失败，第 ${attempt}/3 次。" >&2
            fi
            sleep "$((attempt * 2))"
          done
          echo '推送在 3 次尝试后仍失败。' >&2
          exit 1
